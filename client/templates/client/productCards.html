<div class="card h-100" hx-target="this" hx-swap="outerHTML">
  <img src="{{ product.images.first.image.url }}" class="card-img-top" alt="Product Image 1">
  <div class="card-body d-flex flex-column">
    <h6 class="card-title">{{ product.name }}</h6>
    <p class="card-text small mb-1"><strong>Price:</strong> ${{ product.price }}</p>
    <div class="mt-auto d-flex justify-content-between align-items-center flex-wrap">
      <div class="input-group input-group-sm" style="max-width: 90px;">
        <button class="btn btn-outline-secondary btn-sm" hx-post="/cart/update/{{ product.id }}" hx-vals='{"quantity": 0}'>-</button>
        <input type="text" class="form-control text-center" value="1" readonly>
        <button class="btn btn-outline-secondary btn-sm" hx-post="/cart/update/{{ product.id }}" hx-vals='{"quantity": 2}'>+</button>
      </div>
    <a href="{% url 'product_detail' product.id %}" class="btn btn-primary btn-sm" hx-post="/cart/add/{{ product.id }}" hx-target="#cart-count" hx-swap="innerHTML">
            <i class="fas fa-shopping-cart"></i>
      </a>
    </div>
  </div>
</div>

{% extends 'backend/layout/base.html' %}

{% block content %}

<h1>Main Carousel</h1>
<hr> 

<div class="d-flex justify-content-between">
    <p>List of images in the carousel</p>
    <a href="{% url 'add_main_carousel' %}">
        <button type="button" class="btn-classic btn-sm">
            <i class="fa-solid fa-plus"></i> Add Image
        </button>
    </a>
</div>

<table class="table mt-2">
    <thead>
        <tr>
            <th>Image</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
       {% for image in images %}
        <tr>
            <td><img src="{{ image.image.url }}" alt="#" width="499"></td>
            <td>
               
                <a href="{% url 'delete_image' image.id %}" class="btn-classic btn-sm" onclick="return confirm('Are you sure you want to delete this image?');">
                    <i class="fa-solid fa-trash"></i> Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>


{% endblock%}

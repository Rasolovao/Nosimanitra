<style>
.navbar-desktop {
    background: linear-gradient(to bottom, #d0d0d0 0%, #c0c0c0 100%);
    border: 1px solid #808080;
    padding: 5px 10px;
    font-family: "MS Sans Serif", "Arial", sans-serif;
    color: black;
}
.navbar-desktop .navbar-brand {
    color: black;
    text-shadow: 1px 1px 0px white;
}
</style>
<nav class="navbar navbar-expand-lg navbar-desktop">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Asa360</a>
    </div>
    {% if user.is_authenticated %}
        <div class="d-flex align-items-center me-3 gap-2">
            <span class="me-3">Welcome, {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-dark btn-sm">Logout</button>
            </form>
        </div>
    {% endif %}
</nav>
